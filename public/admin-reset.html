<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị yêu cầu mật khẩu · Kỷ yếu 12A6</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:#f5eee2;color:#1d2b44;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:40px auto;padding:28px;background:#fffdf8;border:1px solid #e3d8c5;border-radius:22px;box-shadow:0 14px 40px #1d2b4418}h1{margin:0 0 10px;font-size:26px}p{line-height:1.55;color:#6b7385}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:12px;border:1px solid #d8ccb8;border-radius:12px;font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:#d8452f;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#efe5d4;color:#1d2b44}.request{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #e3d8c5}.request small{display:block;color:#6b7385;margin-top:5px}#message{min-height:24px;margin:14px 0;color:#6b7385}#requests{margin-top:18px}.password{margin-top:18px;padding:16px;background:#fff0c2;border-radius:14px;overflow-wrap:anywhere}.password code{font-size:18px;font-weight:700;user-select:all}@media(max-width:560px){main{margin:12px auto;padding:20px}.request{align-items:flex-start;flex-direction:column}.request button{width:100%}}
</style></head>
<body><main><h1>Yêu cầu cấp mật khẩu tạm</h1>
<p>Chỉ quản trị viên mới dùng trang này. Hãy xác minh người yêu cầu ngoài đời hoặc qua kênh riêng trước khi cấp mật khẩu.</p>
<div class="row"><input id="adminKey" type="password" autocomplete="off" placeholder="Mã ADMIN_RESET_KEY"><button id="loadButton" type="button">Xem yêu cầu</button></div>
<div class="row" style="margin-top:14px"><input id="inviteCount" type="number" min="1" max="60" value="1" aria-label="Số mã mời"><button id="inviteButton" type="button">Tạo mã mời dùng một lần</button></div><p class="muted">Tạo mã rồi gửi riêng từng bạn. Mỗi mã chỉ đăng ký được một tài khoản; mã chỉ hiển thị một lần.</p><div id="inviteBox"></div><p id="message" aria-live="polite"></p><div id="passwordBox"></div><div id="requests"></div><p><a href="/">Quay lại trang kỷ yếu</a></p></main>
<script>
const keyInput=document.getElementById("adminKey"),message=document.getElementById("message"),requests=document.getElementById("requests"),passwordBox=document.getElementById("passwordBox");const inviteCount=document.getElementById("inviteCount"),inviteBox=document.getElementById("inviteBox");
let adminKey="";
function headers(){return {"X-A6-Admin-Key":adminKey,"Content-Type":"application/json"}}
function say(text,isError){message.textContent=text;message.style.color=isError?"#d8452f":"#6b7385"}
async function loadRequests(){const nextKey=keyInput.value.trim();if(adminKey&&adminKey!==nextKey)passwordBox.replaceChildren();adminKey=nextKey;requests.replaceChildren();if(!adminKey){say("Nhập mã quản trị trước.",true);return}
 try{const response=await fetch("/api/account?action=reset-requests",{headers:headers()}),data=await response.json();if(!response.ok)throw new Error(data.error||"Không tải được yêu cầu.");say("Yêu cầu đang chờ xử lý: "+data.requests.length);if(!data.requests.length){requests.textContent="Hiện không có yêu cầu nào.";return}
  for(const item of data.requests){const row=document.createElement("div");row.className="request";const details=document.createElement("div"),name=document.createElement("strong"),meta=document.createElement("small"),issue=document.createElement("button");name.textContent=item.display_name||item.username;meta.textContent="@"+item.username+" · "+item.created_at;details.append(name,meta);issue.type="button";issue.textContent="Cấp mật khẩu tạm";issue.addEventListener("click",()=>issuePassword(item.id,item.username));row.append(details,issue);requests.append(row)}
 }catch(error){say(error.message,true);if(error.message.includes("không đúng"))adminKey=""}}
async function issuePassword(id,username){if(!confirm("Chỉ tiếp tục sau khi đã xác minh đúng người. Cấp mật khẩu tạm cho @"+username+"?"))return;
 try{const response=await fetch("/api/account",{method:"POST",headers:headers(),body:JSON.stringify({action:"admin-reset-password",requestId:id})}),data=await response.json();if(!response.ok)throw new Error(data.error||"Không cấp được mật khẩu.");passwordBox.replaceChildren();const box=document.createElement("div"),label=document.createElement("p"),code=document.createElement("code"),copy=document.createElement("button");box.className="password";label.textContent="Mật khẩu tạm của @"+data.username+" — hãy gửi riêng và yêu cầu bạn ấy đổi ngay:";code.textContent=data.temporaryPassword;copy.type="button";copy.className="secondary";copy.textContent="Sao chép";copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(data.temporaryPassword);say("Đã sao chép mật khẩu tạm.")}catch{say("Bôi đen mật khẩu để sao chép.",true)}});box.append(label,code,document.createElement("br"),copy);passwordBox.append(box);await loadRequests()
 }catch(error){say(error.message,true)}}
document.getElementById("loadButton").addEventListener("click",loadRequests);async function createInvites(){if(!adminKey){say("Nhập mã quản trị rồi bấm Xem yêu cầu trước.",true);return}const count=Number(inviteCount.value);if(!Number.isInteger(count)||count<1||count>60){say("Chọn từ 1 đến 60 mã.",true);return}
 try{const response=await fetch("/api/account",{method:"POST",headers:headers(),body:JSON.stringify({action:"admin-create-invites",count:count})}),data=await response.json();if(!response.ok)throw new Error(data.error||"Không tạo được mã.");inviteBox.replaceChildren();const note=document.createElement("p");note.textContent="Gửi riêng từng mã cho đúng bạn trong lớp. Không đăng công khai danh sách này.";inviteBox.append(note);for(const code of data.codes){const line=document.createElement("div");line.className="invite-code";line.textContent=code;inviteBox.append(line)}const copy=document.createElement("button");copy.type="button";copy.className="secondary";copy.textContent="Sao chép tất cả mã";copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(data.codes.join("\n"));say("Đã sao chép các mã mời.")}catch{say("Không sao chép được; hãy chọn và copy mã.",true)}});inviteBox.append(copy);say("Đã tạo "+data.codes.length+" mã mời. Hãy lưu và gửi riêng; mã sẽ không hiện lại sau khi rời trang.")}catch(error){say(error.message,true)}}
document.getElementById("inviteButton").addEventListener("click",createInvites);
keyInput.addEventListener("keydown",event=>{if(event.key==="Enter")loadRequests()});
</script></body></html>
